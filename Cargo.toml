[package]
name = "tmux-agents"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
insta = "1.48.0"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
